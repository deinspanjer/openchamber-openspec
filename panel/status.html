<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenSpec change</title>
    <style>
      body {
        margin: 0;
      }
      main,
      .section-content {
        display: grid;
        gap: 8px;
      }
      main {
        padding: 8px 12px;
        overflow-wrap: anywhere;
      }
      [hidden] {
        display: none;
      }
      h1,
      p {
        margin: 0;
      }
      h1 {
        font-size: 1rem;
      }
      .note {
        color: var(--oc-muted);
      }
      .section-heading,
      .section-progress,
      .section-artefacts,
      .section-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-heading,
      .section-artefacts,
      .section-controls {
        flex-wrap: wrap;
      }
      .section-progress .oc-sdk-progress {
        flex: 1;
      }
      .section-progress span {
        font-variant-numeric: tabular-nums;
      }
      .section-artefacts {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      summary {
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      details p {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script src="status.js"></script>
  </body>
</html>
