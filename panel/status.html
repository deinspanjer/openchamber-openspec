<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenSpec change</title>
    <style>
      body {
        margin: 0;
      }
      main,
      .section-content {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
      }
      main {
        padding: 8px 12px;
        overflow-wrap: anywhere;
      }
      [hidden] {
        display: none;
      }
      h1,
      p {
        margin: 0;
      }
      h1 {
        font-size: 1rem;
      }
      .note {
        color: var(--oc-muted);
      }
      .section-heading,
      .section-progress,
      .section-artefacts,
      .section-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-heading,
      .section-artefacts,
      .section-controls {
        flex-wrap: wrap;
      }
      .section-progress .oc-sdk-progress {
        flex: 1;
      }
      .section-progress span {
        font-variant-numeric: tabular-nums;
      }
      .section-artefacts {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .section-picker ul {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 4px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .section-picker > div {
        margin-top: 8px;
      }
      .section-picker li button {
        width: 100%;
        height: auto;
        min-height: 28px;
        padding-block: 6px;
        justify-content: flex-start;
        white-space: normal;
        text-align: start;
      }
      summary {
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      details p {
        white-space: pre-wrap;
      }
      [data-pointer="coarse"] :is(button, summary) {
        min-height: 44px;
      }
      [data-pointer="coarse"] .section-picker li button {
        min-height: 44px;
      }
      [data-pointer="coarse"] summary {
        line-height: 44px;
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script src="status.js"></script>
  </body>
</html>
